<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{{ title }}</title>

        <!-- KaTeX stylesheet -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css"
            integrity="sha384-JctiRyLzXCrSoOOzFlSoWLdyzQl7OrrRnhyeBmzB6ZWtcjccUyc8lCQJqIbs3uQX" crossorigin="anonymous">

        <!-- Default katex stylesheets & scripts -->
        <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js"
        integrity="sha384-+7Keh381hSkXmXqnjC0JBM/kzsN6TFj+wMKychSLjTvJ8/0ElMde2uKl8i6p6Buj"
        crossorigin="anonymous"></script>

        <!-- Highlight.js setup - simplified and corrected -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>

        <!-- Embedding css and macros -->
        <style>
        {{ inline_css | safe }}
        </style>
        <script>
        window.katexMacros = {{ katex_macros | safe }};
        </script>

        <!-- Rendering script -->
        <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Adds captions to images
            $('img').wrap('<figure>')
            $('img').after(function () {return `<figcaption>${$(this).attr('alt')}</figcaption>`});

            // [macro, args] support for katex-macros.js
            const macros = {};
            for (const [name, value] of Object.entries(window.katexMacros)) {
                if (Array.isArray(value)) {
                    macros[name] = value[0];
                } else {
                    macros[name] = value;
                }
            }

            for (let element of document.getElementsByClassName("math")) {
                let content = element.textContent.trim();

                const isDisplayMath =
                    element.tagName.toLowerCase() === "div" ||
                        element.classList.contains("display") ||
                        element.classList.contains("math-display");

                // \derivation expands to an aligned environment and is left-aligned
                // automatically, so Markdown does not need a math-left HTML wrapper.
                const isDerivation =
                    isDisplayMath && /^\\derivation\s*\{/.test(content);

                if (isDisplayMath) {
                    element.classList.add("math-display");
                }

                if (isDerivation) {
                    element.classList.add("math-left", "math-derivation");
                }

                const renderOptions = {
                    throwOnError: true,
                    macros,
                    displayMode: isDisplayMath,
                    strict: "warn"
                };

                try {
                    katex.render(content, element, renderOptions);
                } catch (error) {
                    const message = error instanceof Error
                        ? error.message
                        : String(error);

                    console.error("KaTeX render error:", content, error);
                    element.classList.add("math-error");
                    element.title = message;

                    // Preserve KaTeX's readable red-source fallback while also
                    // surfacing the error in the console and element tooltip.
                    katex.render(content, element, {
                        ...renderOptions,
                        throwOnError: false
                    });
                }
            }

            // Initialise highlight.js for all code blocks
            hljs.highlightAll();

        });

    {% if use_websocket %}

        const urlParams = new URLSearchParams(window.location.search);
        const path = urlParams.get('path');

        let socket = new WebSocket(`ws://${location.host}/watch?path=${encodeURI(path)}`);
        socket.onmessage = function (event) {
            console.log("Recieved Message");
            location.reload();
        }

        console.log(`Created websocket connection to listen for changes to ${path}.`);
    {% endif %}
        </script>

    </head>

    <body>
        <main id="content">
            {{ body | safe }}
        </main>
    </body>

</html>
